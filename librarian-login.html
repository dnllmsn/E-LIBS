<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Portal - PTC Library</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/password-toggle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/password-toggle.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body>

    <div class="auth-page-container">
        <div class="auth-container">
            <!-- Login Form -->
            <div class="auth-form" id="login-form">
                <h2>Librarian Portal</h2>
                <p>Login to manage the library system.</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="loginEmail" required>
                         <p class="email-note">Format: yourname@paterostechnologicalcollege.edu.ph</p>
                    </div>
                    <div class="form-group password-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="loginPassword" name="loginPassword" required>
                            <span class="toggle-password-visibility" id="toggleLoginPassword">
                                <i class="far fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-full">Login</button>
                </form>
            </div>
        </div>
        <div class="back-to-home">
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth-librarian.js"></script>
    <script src="js/password-toggle.js"></script>

</body>
</html>
